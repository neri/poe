[package]
name = "minios"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
device_tree = []
pc = []
sbi = []
# 64-bit Arm machines with a device tree (QEMU virt, Raspberry Pi 3/4, RK3399 Chromebooks)
arm64dt = ["device_tree"]
usb = ["dep:libusb"]
virtio = ["device_tree"]
# Diagnostic output from the USB stack.  Off by default: the console is
# normally a TUI and the stack keeps enumerating in the background, so a line
# printed from a hotplug or a retry lands in the middle of the screen.
usb_debug = ["usb"]

[dependencies]
paste = { version = "1.0" }
seq-macro = { version = "0.3" }
num = { version = "0.4", default-features = false }
embedded-graphics = { version = "0.8" }
heapless = { version = "0.9", default-features = false }
bitflags = { version = "2.13" }

bootprot = {path = "../lib/bootprot/"}
acpi = { path = "../lib/acpi/", features = ["guid"] }
edid = { path = "../lib/edid/" }
fatfs = { path = "../lib/fatfs/" }
fdt = { path = "../lib/fdt/", features = ["guid"] }
guid = { path = "../lib/guid/" }
libhid = { path = "../lib/hid/" }
minilib = { path = "../lib/minilib/" }
simple_font = { path = "../lib/simple_font/" }
smbios = { path = "../lib/smbios/", features = ["guid"] }
tui = { path = "../lib/tui/" }
libusb = { path = "../lib/usb/", optional = true }

uefi = { version="0.40", features = ['global_allocator', 'alloc'], optional = true }
# uefi-raw = { version="0.14" }

[target.'cfg(any(target_arch = "riscv32", target_arch = "riscv64"))'.dependencies]
riscv = { path = "../lib/riscv/" }
sbi = { path = "../lib/sbi/" }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
x86 = { path = "../lib/x86/" }
