[package]
name = "minios"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
device_tree = []
pc = []
rpi = ["device_tree"]
sbi = []

[dependencies]
paste = { version = "1.0" }
seq-macro = { version = "0.3" }
num = { version = "0.4", default-features = false }
embedded-graphics = { version = "0.8" }
heapless = { version = "0.9", default-features = false }
bitflags = { version = "2.11" }

# bootprot = {path = "../lib/bootprot/"}
acpi = { path = "../lib/acpi/", features = ["guid"] }
edid = { path = "../lib/edid/" }
fatfs = { path = "../lib/fatfs/" }
fdt = { path = "../lib/fdt/", features = ["guid"] }
guid = { path = "../lib/guid/" }
libhid = { path = "../lib/hid/" }
minilib = { path = "../lib/minilib/" }
simple_font = { path = "../lib/simple_font/" }
smbios = { path = "../lib/smbios/", features = ["guid"] }
tui = { path = "../lib/tui/" }

uefi = { version="0.37", features = ['global_allocator', 'alloc'], optional = true }
# uefi-raw = { version="0.14" }

[target.'cfg(any(target_arch = "riscv32", target_arch = "riscv64"))'.dependencies]
riscv = { path = "../lib/riscv/" }
sbi = { path = "../lib/sbi/" }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
x86 = { path = "../lib/x86/" }

