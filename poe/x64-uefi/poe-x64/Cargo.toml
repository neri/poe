[package]
edition = "2024"
name = "poe-x64"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
poe = { path = "../../poe/", features = ["uefi"] }
minios = { path = "../../../minios/", features = ["uefi"] }

uefi = { version="0.37", features = ['global_allocator'] }
uefi-raw = { version="0.14" }

[profile.release]
lto = true
opt-level = "z"
panic = "abort"

[workspace]
