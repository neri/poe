[package]
edition = "2024"
name = "poe-arm64"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
poe = { path = "../../poe/", features = ["device_tree", "usb", "virtio"] }
minios = { path = "../../../minios/", features = ["arm64dt", "usb", "virtio"] }

[profile.release]
lto = true
opt-level = "z"
panic = "abort"

[workspace]
